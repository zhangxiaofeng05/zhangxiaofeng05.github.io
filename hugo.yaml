baseURL: "https://zhangxiaofeng05.github.io/" # 必须是完整的、带有协议（HTTPS）且末尾带斜杠/的URL
title: 风吹过的烟花
# copyright: "© [PaperMod Contributors](https://github.com/adityatelange/hugo-PaperMod/graphs/contributors)"
theme: [PaperMod]

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod"]

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 10

languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: 🔍 Search
          url: search/
          weight: 1
        - name: ⏱ Archives
          url: archives/
          weight: 2
        - name: 📚 Posts
          url: posts/
          weight: 5
        - name: 🔖 Tags
          url: tags/
          weight: 10
        - name: 🧩 Categories
          url: categories/
          weight: 11
        - name: 🔥 Firefly
          url: firefly/
          weight: 12
        - name: 🙋🏻‍♂️ About
          url: about/
          weight: 13
